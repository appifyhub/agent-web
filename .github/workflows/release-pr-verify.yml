name: PR Verification on Release

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - release

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.labels.*.name, 'Locked') &&
      (github.event.action != 'labeled' || github.event.label.name == 'Locked')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Prepare the access token
        run: echo "TOKEN=${{ secrets.CI_TOKEN_ABOT }}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

